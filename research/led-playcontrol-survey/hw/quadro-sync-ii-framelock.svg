<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Frame Lock CAT5 daisy chain, no switch">
  <rect width="920" height="380" fill="#0d1218"/>
  <text x="28" y="36" fill="#3ad7c4" font-size="13" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Multi-node Frame Lock: CAT5 daisy chain</text>
  <text x="28" y="56" fill="#8c9aab" font-size="12" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">NVIDIA: not TCP/IP. A switch or NIC can damage the card.</text>
  <rect x="40" y="90" width="200" height="120" fill="#121922" stroke="#e2a73a"/>
  <text x="58" y="118" fill="#e2a73a" font-size="12" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Timing Server</text>
  <text x="58" y="142" fill="#e7eef5" font-size="13" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Sync RJ45</text>
  <rect x="58" y="158" width="50" height="22" fill="#0d1218" stroke="#3ad7c4"/>
  <text x="68" y="174" fill="#3ad7c4" font-size="10" font-family="Consolas, monospace">P1</text>
  <rect x="118" y="158" width="50" height="22" fill="#0d1218" stroke="#3ad7c4"/>
  <text x="128" y="174" fill="#3ad7c4" font-size="10" font-family="Consolas, monospace">P2</text>
  <rect x="360" y="90" width="200" height="120" fill="#121922" stroke="#3ad7c4"/>
  <text x="378" y="118" fill="#3ad7c4" font-size="12" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Client B</text>
  <text x="378" y="142" fill="#e7eef5" font-size="13" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Sync RJ45</text>
  <rect x="378" y="158" width="50" height="22" fill="#0d1218" stroke="#3ad7c4"/>
  <text x="388" y="174" fill="#3ad7c4" font-size="10" font-family="Consolas, monospace">P1</text>
  <rect x="438" y="158" width="50" height="22" fill="#0d1218" stroke="#3ad7c4"/>
  <text x="448" y="174" fill="#3ad7c4" font-size="10" font-family="Consolas, monospace">P2</text>
  <rect x="680" y="90" width="200" height="120" fill="#121922" stroke="#3ad7c4"/>
  <text x="698" y="118" fill="#3ad7c4" font-size="12" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Client C</text>
  <text x="698" y="142" fill="#e7eef5" font-size="13" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Sync RJ45</text>
  <rect x="698" y="158" width="50" height="22" fill="#0d1218" stroke="#3ad7c4"/>
  <text x="708" y="174" fill="#3ad7c4" font-size="10" font-family="Consolas, monospace">P1</text>
  <rect x="758" y="158" width="50" height="22" fill="#0d1218" stroke="#3ad7c4"/>
  <text x="768" y="174" fill="#3ad7c4" font-size="10" font-family="Consolas, monospace">P2</text>
  <path d="M168 169 L378 169" stroke="#3ad7c4"/>
  <text x="230" y="160" fill="#8c9aab" font-size="11" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">CAT5 A.P1 to B.P2</text>
  <path d="M488 169 L698 169" stroke="#3ad7c4"/>
  <text x="540" y="160" fill="#8c9aab" font-size="11" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">CAT5 B.P1 to C.P2</text>
  <rect x="40" y="240" width="520" height="90" fill="#121922" stroke="#e36b5c"/>
  <text x="58" y="270" fill="#e36b5c" font-size="13" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Do not</text>
  <text x="58" y="294" fill="#e7eef5" font-size="13" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Switch / router / NIC / show LAN. Two empty ports at chain ends are normal.</text>
  <rect x="580" y="240" width="300" height="90" fill="#121922" stroke="#314557"/>
  <text x="598" y="270" fill="#8c9aab" font-size="12" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Large cluster</text>
  <text x="598" y="294" fill="#e7eef5" font-size="12" font-family="Microsoft YaHei UI, Segoe UI, sans-serif">Timing Server may fan out two chains. Keep cables short.</text>
</svg>